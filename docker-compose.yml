volumes:
  bundle:

services:
  benchmark:
    environment:
      - HTTPBIN_HOST=nghttp2
      - GEM_HOME=/usr/local/bundle
      - BUNDLE_PATH=/usr/local/bundle
      - BUNDLE_SILENCE_ROOT_WARNING=1
      - BUNDLE_APP_CONFIG=/usr/local/bundle
      - BUNDLE_JOBS=20
    image: ruby:4.0
    depends_on:
      - nghttp2
    volumes:
      - bundle:/usr/local/bundle
      - ./:/home
    command: /home/bench.sh

  benchmark-jruby:
    environment:
      - HTTPBIN_HOST=nghttp2
      - GEM_HOME=/usr/local/bundle
      - BUNDLE_PATH=/usr/local/bundle
      - BUNDLE_SILENCE_ROOT_WARNING=1
      - BUNDLE_APP_CONFIG=/usr/local/bundle
      - BUNDLE_JOBS=20
    image: jruby:10
    depends_on:
      - nghttp2
    volumes:
      - bundle:/usr/local/bundle
      - ./:/home
    command: /home/bench.sh

  nghttp2:
    image: dajobe/nghttpx
    environment:
      ARGS: "--no-ocsp --frontend 0.0.0.0,80;no-tls --frontend 0.0.0.0,443 --backend=httpbin,8000"
      KEY_FILE: /data/etc/certs/nghttp2.key
      CERT_FILE: /data/etc/certs/nghttp2.cert
    depends_on:
      - httpbin
    volumes:
      - ./:/data/etc

  httpbin:
    image: mccutchen/go-httpbin
    environment:
      - PORT=8000
    volumes:
      - ./:/home
